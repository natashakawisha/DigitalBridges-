<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Digital Bridges Zambia</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo"><div class="logo-icon"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div><div><span class="logo-text">Digital Bridges</span><span class="logo-sub">Zambia</span></div></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="learning.html">Learning</a></li><li><a href="faq.html">FAQ</a></li><li><a href="contact.html" class="active">Contact</a></li><!--AUTH_NAV-->
      </ul>
      <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </div>
  </nav>

  <!--BLOCK:contact/banner-->

  <section class="section">
    <div class="section-inner">
      <div class="contact-grid">
        <!--BLOCK:contact/info-->
        <div class="contact-form-card animate-on-scroll">
          <h3>Send Us a Message</h3>
          <form id="contactForm">
            <div class="form-group"><label for="contactName">Full Name</label><input type="text" id="contactName" placeholder="Your full name" required></div>
            <div class="form-group"><label for="contactEmail">Email Address</label><input type="email" id="contactEmail" placeholder="you@example.com" required></div>
            <div class="form-group"><label for="contactSubject">Subject</label><select id="contactSubject" required><option value="">Select a topic</option><option value="partnership">Partnership Inquiry</option><option value="training">Training Request</option><option value="facilitator">Become a Facilitator</option><option value="content">Content Collaboration</option><option value="general">General Inquiry</option></select></div>
            <div class="form-group"><label for="contactMessage">Message</label><textarea id="contactMessage" placeholder="Tell us how we can help..." required></textarea></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!--BLOCK:contact/partners-->

  <!--BLOCK:contact/sustainability-->

  <!--BLOCK:shared/footer-->
  <div class="toast" id="toast"></div>
  <script src="js/script.js"></script>
</body>
</html>
