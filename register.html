<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Digital Bridges Zambia</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="login-page">
    <a href="index.html" class="back-link">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Home
    </a>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;color:var(--primary);"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <h2>Create Account</h2>
          <p>Join Digital Bridges Zambia and start your digital literacy journey</p>
        </div>
        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="regName">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <input type="text" id="regName" name="name" placeholder="Your full name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
              <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              <input type="password" id="regPassword" name="password" placeholder="At least 6 characters" required>
              <button type="button" class="password-toggle" id="toggleRegPassword" aria-label="Toggle password visibility"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="Repeat your password" required>
            </div>
          </div>
          <button type="submit" class="login-btn" id="registerBtn">Create Account</button>
        </form>
        <p class="signup-link">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/script.js"></script>
</body>
</html>
